# CI del servicio de IA (T12). Sin secrets: ningún test llama al proveedor externo
# de IA. Cómo reproducir cada paso en local: README, sección "Integración continua".
name: CI

# Sin filtros `paths:` a propósito: el ruleset exige el check `ci`, y un PR que no
# dispara el workflow quedaría bloqueado esperando un check que nunca llega.
on:
  pull_request:
    branches: [development, staging, master]
  push:
    branches: [development]
  workflow_dispatch:
  # Lo reutiliza cd-staging.yml: si el CI falla, no se despliega.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # El nombre del job es el del check obligatorio del ruleset: no renombrarlo.
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Misma versión menor que el Dockerfile (python:3.12-slim).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check

      - name: Tests
        run: pytest

      - name: Auditoría de dependencias
        run: pip-audit -r requirements.txt

      # Sin push. El target por defecto es `runtime`, la imagen sin dependencias
      # de desarrollo.
      - name: Build de la imagen
        run: docker build -t nutria-ia:ci .
